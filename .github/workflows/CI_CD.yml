name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  frontend:
    name: Front-end build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      # - name: Run tests
      #   run: npm test

      - name: Start server in background
        run: |
          npm start &
          echo $! > server.pid
          sleep 5

      - name: Health check
        run: |
          curl -f http://localhost:3000/ || (cat server.pid && kill $(cat server.pid) && exit 1)

      - name: Stop server
        if: always()
        run: kill $(cat server.pid)
